<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0B1220"/>
  <defs>
    <pattern id="s" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
      <line x1="0" y1="0" x2="0" y2="24" stroke="#1A2238" stroke-width="10"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#s)" opacity="0.5"/>
  <!-- top rule -->
  <rect x="0" y="0" width="1200" height="3" fill="#FF4D1F"/>
  <!-- eyebrow -->
  <text x="72" y="90" font-family="ui-monospace,monospace" font-size="14" letter-spacing="6" fill="#FF4D1F">BUILDERS COLLECTIVE — PENN STATE UNIVERSITY</text>
  <!-- headline -->
  <text x="72" y="240" font-family="system-ui,-apple-system,sans-serif" font-size="120" font-weight="700" letter-spacing="-5" fill="#F4F1EA">WE SHIP</text>
  <text x="72" y="380" font-family="system-ui,-apple-system,sans-serif" font-size="120" font-weight="700" letter-spacing="-5" fill="#F4F1EA">WHILE YOU</text>
  <text x="72" y="520" font-family="system-ui,-apple-system,sans-serif" font-size="120" font-weight="700" letter-spacing="-5" fill="#F4F1EA">SLEEP.</text>
  <!-- stat pills -->
  <rect x="72" y="558" width="130" height="36" fill="none" stroke="#F4F1EA" stroke-width="1.5"/>
  <text x="137" y="582" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" letter-spacing="3" fill="#F4F1EA">6 WINS</text>
  <rect x="218" y="558" width="165" height="36" fill="none" stroke="#F4F1EA" stroke-width="1.5"/>
  <text x="300" y="582" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" letter-spacing="3" fill="#F4F1EA">$31K WON</text>
  <rect x="399" y="558" width="195" height="36" fill="none" stroke="#F4F1EA" stroke-width="1.5"/>
  <text x="496" y="582" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" letter-spacing="3" fill="#F4F1EA">38 SHIPPED</text>
  <!-- domain -->
  <text x="1128" y="582" text-anchor="end" font-family="ui-monospace,monospace" font-size="11" letter-spacing="3" fill="#6B6356">psu.builders</text>
